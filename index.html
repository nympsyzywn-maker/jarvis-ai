<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JARVIS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #05070a;
      color: #00d9ff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 50px 20px;
    }

    h1 {
      font-size: 45px;
      letter-spacing: 10px;
      margin: 20px 0 10px;
    }

    .subtitle {
      color: #78909c;
      font-size: 14px;
      letter-spacing: 3px;
      margin-bottom: 60px;
    }

    #status {
      color: white;
      min-height: 30px;
      margin-bottom: 35px;
      font-size: 17px;
    }

    #micButton {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 3px solid #00d9ff;
      background: #081018;
      color: #00d9ff;
      font-size: 55px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 217, 255, 0.25);
    }

    #micButton:active {
      transform: scale(0.95);
      background: #00d9ff;
      color: #05070a;
    }

    #response {
      margin-top: 50px;
      color: white;
      font-size: 18px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>JARVIS</h1>

    <div class="subtitle">
      PERSONAL AI ASSISTANT
    </div>

    <div id="status">
      Ready
    </div>

    <button id="micButton">
      🎙️
    </button>

    <div id="response"></div>

  </div>

  <script>

    const micButton = document.getElementById("micButton");
    const status = document.getElementById("status");
    const response = document.getElementById("response");

    micButton.addEventListener("click", startListening);

    function startListening() {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {

        status.innerText =
          "Voice recognition is not supported in this browser.";

        return;
      }

      const recognition = new SpeechRecognition();

      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.continuous = false;

      status.innerText = "Listening...";
      response.innerText = "";

      recognition.onresult = function(event) {

        const spokenText =
          event.results[0][0].transcript;

        status.innerText = "I heard you.";

        response.innerText =
          "You said: " + spokenText;

      };

      recognition.onerror = function(event) {

        status.innerText =
          "Microphone error: " + event.error;

      };

      recognition.onend = function() {

        if (status.innerText === "Listening...") {
          status.innerText = "Ready";
        }

      };

      recognition.start();
    }

  </script>

</body>
</html>
