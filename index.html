<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JARVIS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #05070a;
      color: #00d9ff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 50px 20px;
    }

    h1 {
      font-size: 45px;
      letter-spacing: 10px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #78909c;
      letter-spacing: 3px;
      margin-bottom: 50px;
    }

    #status {
      color: white;
      margin: 25px;
    }

    #message {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #00d9ff;
      background: #081018;
      color: white;
      font-size: 16px;
      outline: none;
    }

    #send {
      margin-top: 15px;
      padding: 15px 30px;
      border: 2px solid #00d9ff;
      border-radius: 10px;
      background: #081018;
      color: #00d9ff;
      font-size: 18px;
    }

    #response {
      margin-top: 35px;
      color: white;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>JARVIS</h1>

    <div class="subtitle">
      PERSONAL AI ASSISTANT
    </div>

    <div id="status">
      Ready
    </div>

    <input
      id="message"
      type="text"
      placeholder="Talk to Jarvis..."
    >

    <br>

    <button id="send">
      SEND
    </button>

    <div id="response"></div>

  </div>

  <script>

    const message = document.getElementById("message");
    const send = document.getElementById("send");
    const status = document.getElementById("status");
    const response = document.getElementById("response");

    send.addEventListener("click", function() {

      const text = message.value.trim();

      if (!text) {
        status.innerText = "Type something first.";
        return;
      }

      status.innerText = "Message received.";

      response.innerText =
        "You said: " + text;

      message.value = "";

    });

  </script>

</body>
</html>
