<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>

  <style>
    body {
      margin: 0;
      background: #05070a;
      color: #00d9ff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 60px;
      font-size: 42px;
      letter-spacing: 8px;
    }

    #status {
      color: white;
      margin: 30px;
    }

    button {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 3px solid #00d9ff;
      background: #081018;
      color: #00d9ff;
      font-size: 22px;
    }

    button:active {
      background: #00d9ff;
      color: #05070a;
    }
  </style>
</head>

<body>

  <h1>JARVIS</h1>

  <div id="status">Ready</div>

  <button onclick="listen()">🎙️</button>

  <script>
    function listen() {
      document.getElementById("status").innerText =
        "Listening...";
    }
  </script>

</body>
</html>
